<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ========================================================= -->
  <!-- 1. system-ui / Apple system font aliases → SF Pro          -->
  <!-- ========================================================= -->

  <match target="pattern">
    <test name="family" compare="eq">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <!-- ========================================================= -->
  <!-- 2. Size-based Text → Display switching (macOS-like)        -->
  <!-- ========================================================= -->

  <match target="pattern">
    <test name="family" compare="eq">
      <string>SF Pro Text</string>
    </test>
    <test name="size" compare="more">
      <double>19</double>
    </test>
    <edit name="family" mode="assign_replace">
      <string>SF Pro Display</string>
    </edit>
  </match>

  <!-- ========================================================= -->
  <!-- 3. Generic family mappings (match macOS Chrome defaults)   -->
  <!-- ========================================================= -->

  <!-- sans-serif → Helvetica (macOS Chrome default) -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Helvetica</string>
    </edit>
  </match>

  <!-- serif → Times (macOS Chrome default) -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Times</string>
    </edit>
  </match>

  <!-- monospace → Menlo (Courier New unavailable, Menlo is native macOS) -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Menlo</string>
    </edit>
  </match>

  <!-- ========================================================= -->
  <!-- 4. Reject competing emoji fonts                            -->
  <!-- ========================================================= -->

  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Noto Color Emoji</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Emoji</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Twemoji</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>EmojiOne</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>

  <!-- ========================================================= -->
  <!-- 5. Apple Color Emoji as fallback for all text families     -->
  <!-- ========================================================= -->

  <alias>
    <family>Helvetica</family>
    <prefer>
      <family>Helvetica</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>Times</family>
    <prefer>
      <family>Times</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>Menlo</family>
    <prefer>
      <family>Menlo</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>SF Pro Text</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>SF Pro Display</family>
    <prefer>
      <family>SF Pro Display</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>SF Mono</family>
    <prefer>
      <family>SF Mono</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <!-- Explicit emoji family mapping -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>emoji</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Apple Color Emoji</string>
    </edit>
  </match>

  <!-- ========================================================= -->
  <!-- 6. Default fallback for any unmatched family               -->
  <!-- ========================================================= -->

  <match target="pattern">
    <edit name="family" mode="append">
      <string>Apple Color Emoji</string>
    </edit>
  </match>

</fontconfig>
