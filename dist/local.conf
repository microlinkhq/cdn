<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ========================================================= -->
  <!-- 1. Apple system font aliases                              -->
  <!-- ========================================================= -->

  <match target="pattern">
    <test name="family" compare="eq">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <!-- ========================================================= -->
  <!-- 2. Size-based Text → Display switching (macOS-like)       -->
  <!-- ========================================================= -->

  <!-- Use SF Pro Display for large text -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>SF Pro Text</string>
    </test>
    <test name="size" compare="more">
      <double>19</double>
    </test>
    <edit name="family" mode="assign_replace">
      <string>SF Pro Display</string>
    </edit>
  </match>

  <!-- ========================================================= -->
  <!-- 3. Generic family mappings                                -->
  <!-- ========================================================= -->

  <!-- sans-serif → SF Pro Text -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <!-- serif → Times (macOS default) -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Times New Roman</string>
    </edit>
  </match>

  <!-- monospace → SF Mono -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>SF Mono</string>
    </edit>
  </match>

  <!-- ========================================================= -->
  <!-- 4. Web-safe aliases (match macOS behavior)                -->
  <!-- ========================================================= -->

  <match target="pattern">
    <test name="family" compare="eq">
      <string>Helvetica</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>Arial</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <!-- ========================================================= -->
  <!-- 5. Reject competing emoji fonts                           -->
  <!-- ========================================================= -->

  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Noto Color Emoji</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Emoji</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Twemoji</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>EmojiOne</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>

  <!-- ========================================================= -->
  <!-- 6. Apple Color Emoji as fallback for all text families     -->
  <!-- ========================================================= -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Times New Roman</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>SF Mono</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>SF Pro Text</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>SF Pro Display</family>
    <prefer>
      <family>SF Pro Display</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>SF Mono</family>
    <prefer>
      <family>SF Mono</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <!-- Explicit emoji family mapping -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>emoji</string>
    </test>
    <edit name="family" mode="assign_replace">
      <string>Apple Color Emoji</string>
    </edit>
  </match>

  <!-- ========================================================= -->
  <!-- 7. Default fallback for any unmatched family               -->
  <!-- ========================================================= -->

  <match target="pattern">
    <edit name="family" mode="append">
      <string>Apple Color Emoji</string>
    </edit>
  </match>

</fontconfig>
